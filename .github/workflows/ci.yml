name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — type-check & tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/daaragest_test
      JWT_SECRET: ci-jwt-secret-min-32-chars-padding-aaa
      QR_SECRET: ci-qr-secret-min-32-chars-padding-bbbb
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npx tsc -p tsconfig.json

  integration:
    name: Backend — tests d'intégration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: daaragest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/daaragest_test
      JWT_SECRET: ci-jwt-secret-min-32-chars-padding-aaa
      QR_SECRET: ci-qr-secret-min-32-chars-padding-bbbb
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      # Depuis le squash du 2026-06-07, l'historique se résume à une baseline
      # rejouable. On teste donc le VRAI replay des migrations : si une future
      # migration casse le replay depuis zéro, la CI échouera ici.
      - name: Apply migrations (replay depuis zéro)
        working-directory: backend
        run: npx prisma migrate deploy
      # Chemin « installation à neuf » (audit SenInit DG-CONF-001) : sur une base VIERGE, migrations puis seed
      # de production, deux fois (le second passage doit être un no-op). Avant, le seed plantait faute de
      # `code` d'établissement et le conteneur ne démarrait pas — sans qu'aucun test ne le voie.
      - name: Installation à neuf (migrations + seed de production sur base vierge)
        working-directory: backend
        env:
          PGPASSWORD: test
          FRESH_URL: postgresql://test:test@localhost:5432/daaragest_fresh
          ETABLISSEMENT_CODE: CIF
          ADMIN_INITIAL_PASSWORD: Ci-Admin-2026!x
        run: |
          psql -h localhost -U test -d postgres -c 'CREATE DATABASE daaragest_fresh'
          DATABASE_URL=$FRESH_URL npx prisma migrate deploy
          DATABASE_URL=$FRESH_URL node prisma/seed-prod.cjs
          DATABASE_URL=$FRESH_URL node prisma/seed-prod.cjs
          test "$(psql -h localhost -U test -d daaragest_fresh -tAc "select count(*) from \"Utilisateur\" where identifiant='admin'")" = "1"
          test "$(psql -h localhost -U test -d daaragest_fresh -tAc "select count(*) from \"Role\"")" -ge 7
      - name: Integration tests
        working-directory: backend
        run: npm run test:integration

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npx vite build
